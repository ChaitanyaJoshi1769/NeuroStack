[package]
name = "neurostack-query-runtime"
version = "0.1.0"
edition = "2021"
description = "High-performance query execution runtime for NeuroStack"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlparser = "0.43"
duckdb = "0.9"
anyhow = "1.0"
thiserror = "1.0"
dashmap = "5.5"
lru = "0.12"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "query-runtime"
path = "src/main.rs"
